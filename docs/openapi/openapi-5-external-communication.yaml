openapi: 3.1.0
info:
  title: SIH-26135 Analytics Backend API
  description: |
    ### SIH-26135 Unified Trainee Tracking, Verification, Analytics & Governance Engine

    Enterprise REST API providing end-to-end vocational skill training monitoring, longitudinal employment verification, statutory DPDP Act 2023 compliance, automated data quality assurance, multi-channel communication dispatch, and high-throughput analytical exports.

    ---

    #### 1. Core Domain Capabilities
    - **Master Entities**: Geographies (States, Districts), Users, Roles, Permissions, Trainees, Courses, Programs, Schemes, Sectors, Training Centers, Training Providers, Training Batches, and Enrollments.
    - **Lifecycle Records**: Assessments, Certifications, Placements, Employment Records, Salary Histories, Exit Events, Unemployment Records, and Longitudinal Surveys.

    #### 2. Multi-Step Workflow Engines
    - **Candidate Lifecycle**: End-to-end status tracking from enrollment to certified, placed, verified employment, or dropout/exit.
    - **Placement & Employment**: Transition placement records to verified employment with compensation history logging.
    - **Longitudinal Verification**: Multi-channel verification attempts (SMS, WhatsApp, IVR, physical employer confirmation), evidence capture, and SLA escalation.
    - **Skill Gap & Remediation**: Anomaly identification, personalized diagnostic recommendations, and automated remediation triggers.

    #### 3. Advanced Analytics & MIS Reporting
    - **Projected Read Models**: Q01-Q22 analytical fact aggregations and summaries.
    - **Dashboards**: Real-time Geographic, Executive, Data Integrity, Economic Outcome, Retention/Attrition, Skill Gap, and Operational oversight.
    - **Streaming Exports**: Memory-bounded CSV and JSON export streams with sliding-window concurrency limits and formula injection defense (CWE-1236).

    #### 4. Data Quality & Operations Governance
    - **Anomaly Detection Engine**: Real-time cross-field validation, spike alarms, and automated issue tracking.
    - **Bulk Staging & Ingestion**: High-volume multipart CSV ingestion with chunked staging, quarantine isolation, and transactional commit.
    - **Audit Logging**: Immutable actor attribution, entity correlation tracking, and tamper-evident event streaming.

    #### 5. External Communication
    - **Durable Dispatch Queue**: Multi-worker lease management, exponential backoff retries, and dead-letter queue containment.
    - **Provider Integrations**: Twilio SMS, WhatsApp Business API, Twilio SendGrid email, and fallback SMTP delivery.
    - **Webhook Receipts**: Asynchronous webhook ingestion for real-time delivery status synchronization.

    #### 6. Security, Tenancy & DPDP Compliance
    - **Authentication**: Stateless HMAC-SHA256 / RSA Bearer JWT tokens.
    - **Role-Based Authorization**: `ROLE_super_admin`, `ROLE_national_admin`, `ROLE_state_admin`, `ROLE_district_admin`, `ROLE_training_provider`, `ROLE_employer`, `ROLE_trainee`, `ROLE_auditor`.
    - **Tenancy Scoping**: Territorial bounding (State/District), Institutional bounding (Provider/Employer), and Trainee self-service scoping.
    - **Statistical Disclosure Control (SDC)**: $k=5$ minimum cell suppression, complementary secondary suppression, partition anti-differencing, and zero canary credential leakage.
  version: v1.0.0
servers:
- url: http://localhost:8080/
  description: Local Development & Demonstration Server
security:
- bearerAuth: []
tags:
- name: Communication - Inbound Webhooks
  description: "Inbound vendor delivery status webhooks (Twilio SMS/WhatsApp, SendGrid\
    \ Email)"
- name: Communication - Dispatch Queue
  description: Multi-channel asynchronous delivery queues and dispatch jobs
paths:
  /api/v1/communication-logs/{id}:
    get:
      tags:
      - communication-log-controller
      operationId: getById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseCommunicationLogResponse"
    put:
      tags:
      - communication-log-controller
      operationId: updateCommunicationLog
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommunicationLogRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseCommunicationLogResponse"
    delete:
      tags:
      - communication-log-controller
      operationId: deleteCommunicationLog
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/v1/communication/webhooks/{provider}:
    post:
      tags:
      - Communication - Inbound Webhooks
      summary: Ingest Provider Webhook
      description: "Public webhook endpoint for receiving asynchronous delivery receipts\
        \ from external providers (Twilio, SendGrid, Mock). Authenticated via HMAC/Ed25519\
        \ vendor signature headers."
      operationId: handleProviderWebhook
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Webhook payload validated and processed successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseWebhookProcessingResult"
        "400":
          description: Invalid payload or missing provider identifier
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseWebhookProcessingResult"
        "401":
          description: Unauthorized - invalid HMAC vendor signature
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseWebhookProcessingResult"
        "404":
          description: Provider not supported
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseWebhookProcessingResult"
  /api/v1/communication/templates/{templateCode}/render:
    post:
      tags:
      - communication-template-controller
      operationId: renderTemplate
      parameters:
      - name: templateCode
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: traineeId
        in: query
        required: false
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseRenderedTemplate"
  /api/v1/communication/dead-letter/{jobId}/replay:
    post:
      tags:
      - Communication - Dispatch Queue
      summary: Replay Dead-Letter Job
      description: "Manually replays an exhausted or dead-lettered job after issue\
        \ remediation, enforcing strict tenant isolation."
      operationId: replayDeadLetterJob
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      responses:
        "200":
          description: Job re-enqueued for delivery
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseDispatchJobDto"
        "403":
          description: Access denied - job belongs to different tenant
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseDispatchJobDto"
        "404":
          description: Dispatch job not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseDispatchJobDto"
      security:
      - bearerAuth: []
  /api/v1/communication-logs:
    get:
      tags:
      - communication-log-controller
      operationId: getByTrainee
      parameters:
      - name: traineeId
        in: query
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: createdAt
      - name: direction
        in: query
        required: false
        schema:
          type: string
          default: DESC
      - name: surveyResponseId
        in: query
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      - name: surveyId
        in: query
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      - name: statusId
        in: query
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      - name: purposeId
        in: query
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      - name: providerMessageId
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      - name: followupTaskId
        in: query
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      - name: directionId
        in: query
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      - name: channelId
        in: query
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: "#/components/schemas/ApiResponseCommunicationLogResponse"
                - $ref: "#/components/schemas/ApiResponsePagedResponseCommunicationLogResponse"
    post:
      tags:
      - communication-log-controller
      operationId: logCommunication
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommunicationLogRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseCommunicationLogResponse"
  /api/v1/communication-logs/dispatch:
    post:
      tags:
      - communication-log-controller
      operationId: dispatchNotification
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchNotificationRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseNotificationDispatchResponse"
  /api/v1/communication/templates:
    get:
      tags:
      - communication-template-controller
      operationId: getAllTemplates
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListTemplateDefinition"
  /api/v1/communication/templates/{templateCode}:
    get:
      tags:
      - communication-template-controller
      operationId: getTemplateByCode
      parameters:
      - name: templateCode
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseTemplateDefinition"
  /api/v1/communication/jobs/{jobId}:
    get:
      tags:
      - Communication - Dispatch Queue
      summary: Get Dispatch Job by ID
      description: "Retrieves durable dispatch job details and delivery status, enforcing\
        \ tenant isolation."
      operationId: getJobById
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      responses:
        "200":
          description: Dispatch job found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseDispatchJobDto"
        "403":
          description: Access denied - job belongs to different tenant
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseDispatchJobDto"
        "404":
          description: Dispatch job not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseDispatchJobDto"
      security:
      - bearerAuth: []
  /api/v1/communication/jobs/{jobId}/attempts:
    get:
      tags:
      - Communication - Dispatch Queue
      summary: Get Job Execution Attempts
      description: "Retrieves execution attempt audit history for a dispatch job,\
        \ enforcing tenant isolation."
      operationId: getJobAttempts
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      responses:
        "200":
          description: Job execution attempts returned
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListDispatchAttemptDto"
        "403":
          description: Access denied - job belongs to different tenant
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListDispatchAttemptDto"
        "404":
          description: Dispatch job not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListDispatchAttemptDto"
      security:
      - bearerAuth: []
  /api/v1/communication/dead-letter:
    get:
      tags:
      - Communication - Dispatch Queue
      summary: Get Dead-Letter Queue Jobs
      description: "Retrieves paginated dead-letter queue records for administrative\
        \ review, strictly partitioned by authorized tenant."
      operationId: getDeadLetterJobs
      parameters:
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          description: Dead letter jobs retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListDispatchJobDto"
        "403":
          description: Access denied - caller lacks required tenant scope
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListDispatchJobDto"
      security:
      - bearerAuth: []
