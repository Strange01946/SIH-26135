spring.application.name=sih26135-backend-test

# Dedicated test database configuration:
# Strictly targets dedicated test catalog SIH26135_TEST (never production SIH26135).
# Supports explicit full URL override (SIH_TEST_DB_URL) or host/port overrides (SIH_TEST_DB_HOST, SIH_TEST_DB_PORT).
# Requires explicit test credentials (SIH_TEST_DB_USERNAME, SIH_TEST_DB_PASSWORD).
# NEVER falls back to generic DB_* variables or the normal SIH26135 database.
spring.datasource.url=${SIH_TEST_DB_URL:jdbc:mysql://${SIH_TEST_DB_HOST:localhost}:${SIH_TEST_DB_PORT:3306}/SIH26135_TEST?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Kolkata}
spring.datasource.username=${SIH_TEST_DB_USERNAME:root}
spring.datasource.password=${SIH_TEST_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Existing schema validation: strictly validate, never alter/drop/create tables
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# Test logging configuration
logging.level.root=INFO
logging.level.in.gov.sih.sih26135=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.hibernate.tool.schema=INFO

# Dedicated test JWT configuration:
# Uses dedicated test-only key material (>= 32 bytes) or explicit SIH_TEST_JWT_SECRET.
# NEVER falls back to production JWT_SECRET.
security.jwt.secret=${SIH_TEST_JWT_SECRET:dedicated-test-only-jwt-secret-material-256-bits-minimum}
security.jwt.issuer=in.gov.sih.sih26135-test
security.jwt.access-token-expiration-ms=900000
security.jwt.refresh-token-expiration-ms=604800000

# Security Lockout
security.lockout.max-failed-attempts=5
security.lockout.lock-duration=15m

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
