# ==============================================================================
# SIH-26135 Local Demonstration Profile
# Activated via: --spring.profiles.active=local-demo or -Dspring.profiles.active=local-demo
# Enables interactive Swagger UI and raw OpenAPI 3.0 documentation for local review.
# ==============================================================================

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.show-actuator=false

# Local demonstration profile CORS allowance
security.cors.allowed-origins=http://localhost:5173
