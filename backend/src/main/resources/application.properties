spring.application.name=sih26135-backend

# Credentials: DB_USERNAME and DB_PASSWORD (do not commit secrets).
# Optional overrides: DB_HOST, DB_PORT, DB_NAME.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:SIH26135}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Existing SIH26135 schema is the source of truth. Never create/update/drop.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# Baseline logging: production-oriented, safe levels
logging.level.root=INFO
logging.level.in.gov.sih.sih26135=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.hibernate.tool.schema=INFO

# JWT Token Configuration (Environment-backed; no fallback or default secret)
security.jwt.secret=${JWT_SECRET:}
security.jwt.issuer=${JWT_ISSUER:in.gov.sih.sih26135}
security.jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
security.jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

# Account Lockout & Brute-Force Protection
security.lockout.max-failed-attempts=${SECURITY_LOCKOUT_MAX_FAILED_ATTEMPTS:5}
security.lockout.lock-duration=${SECURITY_LOCKOUT_DURATION:15m}
