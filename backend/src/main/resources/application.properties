spring.application.name=sih26135-backend

# Credentials: DB_USERNAME and DB_PASSWORD (do not commit secrets).
# Optional overrides: DB_HOST, DB_PORT, DB_NAME.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:SIH26135}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Existing SIH26135 schema is the source of truth. Never create/update/drop.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# Baseline logging: production-oriented, safe levels
logging.level.root=INFO
logging.level.in.gov.sih.sih26135=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.hibernate.tool.schema=INFO

# JWT Token Configuration (Environment-backed; no fallback or default secret)
security.jwt.secret=${JWT_SECRET:}
security.jwt.issuer=${JWT_ISSUER:in.gov.sih.sih26135}
security.jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
security.jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

# Account Lockout & Brute-Force Protection
security.lockout.max-failed-attempts=${SECURITY_LOCKOUT_MAX_FAILED_ATTEMPTS:5}
security.lockout.lock-duration=${SECURITY_LOCKOUT_DURATION:15m}

# Actuator / Management Observability & Production Hardening (Phase 29.11)
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoints.web.exposure.exclude=env,configprops,beans,heapdump,threaddump,logfile,mappings,shutdown
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ROLE_ADMIN,ROLE_super_admin
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,databaseLatency
management.endpoint.health.group.diagnostics.include=db,databaseLatency,caffeineCache,bulkImportStorage,communicationGateway,diskSpace

# Prometheus & Micrometer Metrics Configuration
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=sih26135-backend
management.metrics.distribution.sla.http.server.requests=500ms,1s
management.metrics.enable.jvm=true
management.metrics.enable.hikaricp=true

# Observability Latency & Storage Thresholds
management.health.database.latency-threshold-ms=500
management.health.bulk-import.min-disk-space-bytes=1073741824

# Structured Logging Configuration (Spring Boot 3.4 native structured logging)
# Defaults to empty (human-readable console). Set to 'ecs' or 'logstash' via environment for structured JSON output.
logging.structured.format.console=${LOGGING_STRUCTURED_FORMAT:}

# Production CORS Configuration (Environment-backed; default empty disallows cross-origin requests)
security.cors.allowed-origins=${SECURITY_CORS_ALLOWED_ORIGINS:}
security.cors.allowed-methods=${SECURITY_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
security.cors.allowed-headers=${SECURITY_CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,Origin,X-Requested-With,X-Correlation-Id,X-Request-Id}
security.cors.exposed-headers=${SECURITY_CORS_EXPOSED_HEADERS:Authorization,X-Correlation-Id,X-Request-Id}
security.cors.allow-credentials=${SECURITY_CORS_ALLOW_CREDENTIALS:false}
security.cors.max-age=${SECURITY_CORS_MAX_AGE:3600s}

# Bulk Ingestion Multipart & Staging Bounds
spring.servlet.multipart.max-file-size=${IMPORT_MULTIPART_MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${IMPORT_MULTIPART_MAX_REQUEST_SIZE:25MB}
import-pipeline.deployment-mode=${IMPORT_PIPELINE_DEPLOYMENT_MODE:SINGLE_INSTANCE}
import-pipeline.chunk-size=${IMPORT_PIPELINE_CHUNK_SIZE:100}
import-pipeline.max-file-size-bytes=${IMPORT_PIPELINE_MAX_FILE_SIZE_BYTES:10485760}
import-pipeline.max-rows-per-batch=${IMPORT_PIPELINE_MAX_ROWS_PER_BATCH:10000}
import-pipeline.max-row-bytes=${IMPORT_PIPELINE_MAX_ROW_BYTES:65536}

# Operational Diagnostics, Spike Thresholds & Anti-Storm Throttling (Phase 28.6)
system-events.rate-limit-alert-cooldown-seconds=${SYSTEM_EVENTS_RATE_LIMIT_COOLDOWN_SECONDS:60}
system-events.dedup-window-seconds=${SYSTEM_EVENTS_DEDUP_WINDOW_SECONDS:60}
data-quality.spike-new-issues-threshold=${DQ_SPIKE_NEW_ISSUES_THRESHOLD:20}
data-quality.spike-high-severity-threshold=${DQ_SPIKE_HIGH_SEVERITY_THRESHOLD:10}
data-quality.spike-critical-severity-threshold=${DQ_SPIKE_CRITICAL_SEVERITY_THRESHOLD:1}
data-quality.spike-alert-cooldown-seconds=${DQ_SPIKE_ALERT_COOLDOWN_SECONDS:300}

# Communication Provider Configuration (Phase 29.3)
communication.mode=${COMMUNICATION_PROVIDER_MODE:MOCK}
communication.live-recipient-override-enabled=${COMMUNICATION_LIVE_RECIPIENT_OVERRIDE_ENABLED:true}
communication.email-provider-type=${COMMUNICATION_EMAIL_PROVIDER_TYPE:AUTO}

# Twilio SMS & WhatsApp Messaging
communication.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
communication.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
communication.twilio.sms-from=${TWILIO_SMS_FROM:}
communication.twilio.whatsapp-from=${TWILIO_WHATSAPP_FROM:}
communication.twilio.live-test-phone=${SIH_LIVE_TEST_PHONE:}
communication.twilio.live-test-whatsapp=${SIH_LIVE_TEST_WHATSAPP:}
communication.twilio.whatsapp-content-sid=${TWILIO_WHATSAPP_CONTENT_SID:}
communication.twilio.whatsapp-content-variables=${TWILIO_WHATSAPP_CONTENT_VARIABLES:}
communication.twilio.connect-timeout-ms=${TWILIO_CONNECT_TIMEOUT_MS:5000}
communication.twilio.read-timeout-ms=${TWILIO_READ_TIMEOUT_MS:10000}

# Twilio SendGrid Email
communication.sendgrid.api-key=${SENDGRID_API_KEY:}
communication.sendgrid.from-email=${SENDGRID_FROM_EMAIL:}
communication.sendgrid.live-test-email=${SIH_LIVE_TEST_EMAIL:}
communication.sendgrid.webhook-verification-key=${SENDGRID_WEBHOOK_VERIFICATION_KEY:}
communication.sendgrid.connect-timeout-ms=${SENDGRID_CONNECT_TIMEOUT_MS:5000}
communication.sendgrid.read-timeout-ms=${SENDGRID_READ_TIMEOUT_MS:10000}

# Webhook Testing Controls
communication.allow-test-webhook-signatures=${COMMUNICATION_ALLOW_TEST_WEBHOOK_SIGNATURES:false}

# Gmail SMTP Email (Alternative Provider)
communication.smtp.host=${SMTP_HOST:smtp.gmail.com}
communication.smtp.port=${SMTP_PORT:587}
communication.smtp.username=${SMTP_USERNAME:}
communication.smtp.password=${SMTP_APP_PASSWORD:}
communication.smtp.from-email=${SMTP_FROM_EMAIL:}
communication.smtp.live-test-email=${SIH_LIVE_TEST_EMAIL:}
communication.smtp.auth=${SMTP_AUTH:true}
communication.smtp.starttls=${SMTP_STARTTLS:true}
communication.smtp.connection-timeout-ms=${SMTP_CONNECTION_TIMEOUT_MS:5000}
communication.smtp.timeout-ms=${SMTP_TIMEOUT_MS:10000}
communication.smtp.write-timeout-ms=${SMTP_WRITE_TIMEOUT_MS:5000}

# OpenAPI 3.0 / Swagger UI Configuration (Phase 29.9)
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:false}
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.show-actuator=false
